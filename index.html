<style>
:root{
  --bg:#ffffff; --fg:#000000; --sub:#262626; --line:#000000; --card:#efefef; --chip:#e2e2e2;
  --sig:#ffc600; --sig-fg:#000000; --ok:#006b2e; --ok-fg:#ffffff; --bad:#b3000c; --bad-fg:#ffffff;
  --focus:#0040ff; color-scheme:light;
}
[data-theme="night"]{
  --bg:#000000; --fg:#ffffff; --sub:#d9d9d9; --line:#ffffff; --card:#161616; --chip:#262626;
  --ok:#30d36b; --ok-fg:#000000; --bad:#ff5c5c; --bad-fg:#000000; --focus:#7aa6ff; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:500 20px/1.35 Roboto,"Segoe UI",system-ui,Arial,sans-serif}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.btn:active{transform:translateY(2px)}}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:4px solid var(--line);background:var(--bg)}
.brand{flex:1;display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.01em;background:none;border:0;padding:0;min-height:56px;text-align:left}
.brand .mark{height:48px;width:auto;border-radius:6px;display:block}
.brand .txt b{color:var(--bad)}
.hero{display:block;width:100%;max-width:240px;margin:0 auto;border-radius:14px;border:3px solid var(--line)}
.hbtn{min-width:56px;min-height:56px;padding:0 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg);font-weight:800;font-size:17px}
.hbtn.on{background:var(--fg);color:var(--bg)}
@media (max-width:640px){.brand .txt{display:none}}
.brand .txt{white-space:nowrap}

/* run context */
.ctx{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.pill{border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:16px;font-weight:800}
.pill.truck{background:var(--fg);color:var(--bg)}
.crumbs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border:0;border-bottom:3px solid var(--line);background:var(--bg);width:100%;min-height:62px;align-items:center;scrollbar-width:none;text-align:left}
.crumbs::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border:2px solid var(--line);border-radius:8px;padding:5px 10px;font-size:17px;font-weight:700;white-space:nowrap}
.chip.x{border-color:var(--bad)} .chip.y{border-color:var(--ok)}
.chip.more{background:var(--fg);color:var(--bg)}
.crumbs .empty{font-size:17px;color:var(--sub)}

main{flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 14px 20px;width:100%;max-width:760px;margin:0 auto}
h1.q{font-size:30px;line-height:1.18;font-weight:900;margin:0;letter-spacing:-.01em}
h2{font-size:22px;font-weight:900;margin:8px 0 0}
.help{font-size:19px;color:var(--sub);margin:0}
.step-no{font-size:18px;font-weight:800;color:var(--sub);margin:0}
.answers{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:10px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:72px;padding:12px 18px;border:3px solid var(--line);border-radius:12px;background:var(--bg);font-size:22px;font-weight:800;text-align:center;line-height:1.2}
.btn.ans{justify-content:flex-start;text-align:left}
.btn.pri{background:var(--fg);color:var(--bg)}
.btn.sig{background:var(--sig);color:var(--sig-fg);border-color:#000}
.btn.ok{background:var(--ok);color:var(--ok-fg);border-color:var(--ok)}
.btn.bad{background:var(--bad);color:var(--bad-fg);border-color:var(--bad)}
.btn.sm{min-height:56px;font-size:19px}
.btn.sel{background:var(--fg);color:var(--bg)}
.btn[disabled]{opacity:.4}
.btn .tag{margin-left:auto;font-size:14px;font-weight:900;background:var(--sig);color:#000;border:2px solid #000;border-radius:6px;padding:2px 6px;flex:none}
.seg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.field-label{font-size:19px;font-weight:900;margin:10px 0 -4px}
.field-label.miss{color:var(--bad)}
input.big{width:100%;min-height:68px;border:3px solid var(--line);border-radius:12px;background:var(--bg);padding:0 16px;font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
input.big::placeholder{text-transform:none;font-weight:500;letter-spacing:0;color:var(--sub)}
input.big.miss,select.big.miss{border-color:var(--bad);border-width:5px}
select.big{width:100%;min-height:68px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:0 12px;font-size:24px;font-weight:800}
input.big.id{text-transform:none}
.addrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.addrow .btn{width:auto;min-height:68px}
textarea{width:100%;min-height:96px;border:3px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font-size:20px}

/* placeholder warning — hazard tape */
.ph{background:repeating-linear-gradient(-45deg,#ffc600 0 12px,#000 12px 24px);padding:5px;border-radius:10px}
.ph div{background:#ffc600;color:#000;border-radius:6px;padding:8px 12px;font-size:17px;font-weight:800}
.src{font-size:16px;color:var(--sub);margin:0}
details.src summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:800}
details.src p{margin:4px 0 0}
.done{border:3px solid var(--ok);border-left-width:10px;border-radius:10px;padding:8px 12px;font-size:19px;background:var(--card)}
.done b{display:block;font-size:15px;color:var(--ok)}
.badge{align-self:flex-start;font-size:15px;font-weight:900;border:2px solid #000;border-radius:6px;padding:2px 8px;background:var(--sig);color:#000}
.btn.stop{letter-spacing:.02em;margin-top:8px}
.o.ESCALATE_TS,.o.ESCALATE_DISPATCH{background:var(--bad);color:var(--bad-fg);border-color:var(--bad)}
.draft{border:3px solid var(--line);border-left-width:10px;border-radius:10px;padding:8px 12px;font-size:17px;background:var(--card)}

/* action card: the one loud element */
.act{border:4px solid #000;border-radius:14px;overflow:hidden;background:var(--card)}
.act-head{background:repeating-linear-gradient(-45deg,#ffc600 0 18px,#000 18px 36px);padding:6px}
.act-head span{display:inline-block;background:#ffc600;color:#000;font-weight:900;font-size:20px;padding:6px 12px;border-radius:6px}
.act-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
ol.steps{margin:0;padding-left:30px;font-size:21px;font-weight:600}
ol.steps li{margin:6px 0;padding-left:4px}
.caution{border-left:8px solid var(--bad);background:var(--bg);padding:10px 12px;font-size:18px;font-weight:700}

.term{border-radius:14px;padding:20px 18px;font-size:32px;font-weight:900;line-height:1.1}
.term.ok{background:var(--ok);color:var(--ok-fg)} .term.bad{background:var(--bad);color:var(--bad-fg)}
.term small{display:block;font-size:20px;font-weight:700;margin-top:8px}
pre.sum{white-space:pre-wrap;word-break:break-word;margin:0;font:600 16px/1.45 "Roboto Mono",ui-monospace,Menlo,monospace;background:var(--card);border:3px solid var(--line);border-radius:12px;padding:12px;max-height:42vh;overflow:auto}

.banner{border:4px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:16px;color:var(--sub);margin:8px 0 0}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;width:100%;min-height:72px;padding:12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.item .o{grid-row:span 2;font-size:15px;font-weight:900;padding:6px 8px;border-radius:6px;border:2px solid var(--line);min-width:96px;text-align:center}
.o.RESOLVED{background:var(--ok);color:var(--ok-fg);border-color:var(--ok)}
.o.ESCALATE_VRE{background:var(--bad);color:var(--bad-fg);border-color:var(--bad)}
.o.ABANDONED{background:var(--chip)}
.item b{font-size:20px} .item span{font-size:16px;color:var(--sub)}
.tree{border:3px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.tree ul{margin:0;padding-left:22px;font-size:16px}
.err{color:var(--bad);font-weight:800} .warn{color:var(--sub)}

.bar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--line);background:var(--bg);z-index:5}
.bar .btn{min-height:64px;font-size:20px}

.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-body{flex:1;overflow:auto;padding:16px 14px;max-width:760px;width:100%;margin:0 auto}
.log{margin:0;padding-left:34px;font-size:19px}
.log li{margin:0 0 12px}
.log .t{font-size:15px;color:var(--sub);display:block}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:14px 22px;border-radius:12px;font-weight:900;font-size:20px;z-index:50;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
.hidden{display:none}
  /* ===== FUTURISTIC / TERMINAL THEME ===== */
  :root,[data-theme="night"]{--bg:#050b07; --fg:#d9ffe7; --sub:#6fa985; --line:#1d4d2f; --card:#0a1810; --chip:#0e2216; --neon:#39ff88; --sig:#ffb000; --sig-fg:#140c00; --ok:#39ff88; --ok-fg:#00170a; --bad:#ff3b5c; --bad-fg:#14000a; --focus:#39ff88; color-scheme:dark}
  html{background:var(--bg)}
  body{background:linear-gradient(rgba(57,255,136,.04) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(57,255,136,.04) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(ellipse at top,#0b2414 0%,var(--bg) 70%);background-attachment:fixed}
  .field-label,.step-no,.status,.src,.pill,.chip,.item .o,.btn .tag,.act-head span{font-family:"JetBrains Mono","Roboto Mono",ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.14em}
  .field-label{font-size:14px;color:var(--neon);font-weight:700}
  .field-label::before{content:"// ";opacity:.6}
  h1.q,h2{color:var(--neon);text-shadow:0 0 18px rgba(57,255,136,.35)}
  .brand .txt{color:var(--neon);text-shadow:0 0 12px rgba(57,255,136,.5);letter-spacing:.06em}
  .brand .txt b{color:var(--bad);text-shadow:0 0 12px rgba(255,59,92,.6)}
  .btn,.hbtn,.item,input.big,select.big,textarea{background:rgba(10,24,16,.85);border:1px solid var(--line);color:var(--fg);transition:border-color .15s,box-shadow .15s}
  .btn:hover,.hbtn:hover,.item:hover,input.big:focus,select.big:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 16px rgba(57,255,136,.25)}
  .btn.pri,.btn.sel,.hbtn.on,.pill.truck,.chip.more{background:var(--neon);color:#00170a;border-color:var(--neon);box-shadow:0 0 18px rgba(57,255,136,.35)}
  .btn.sig{border-color:var(--sig)}
  select.big option{background:#0a1810;color:var(--fg)}
  .top,.bar{border-color:var(--line);background:rgba(5,11,7,.9);backdrop-filter:blur(6px)}
  .top{box-shadow:0 1px 0 rgba(57,255,136,.25)}
  .crumbs{border-color:var(--line);background:transparent}
  .banner,.tree,.draft,pre.sum{border:1px solid var(--line);background:var(--card)}
  .hero{border:1px solid var(--neon);box-shadow:0 0 30px rgba(57,255,136,.25)}
  .act{border:1px solid var(--neon);box-shadow:0 0 24px rgba(57,255,136,.18)}
  .act-head{background:repeating-linear-gradient(-45deg,var(--neon) 0 14px,#06140b 14px 28px)}
  .act-head span{background:#06140b;color:var(--neon);border:1px solid var(--neon);font-size:16px}
  .ph{background:repeating-linear-gradient(-45deg,var(--sig) 0 12px,#140c00 12px 24px)}
  .ph div{background:#1a1200;color:var(--sig)}
  .btn .tag{background:transparent;color:var(--sig);border:1px solid var(--sig)}
  .term.ok{box-shadow:0 0 30px rgba(57,255,136,.4)}
  .term.bad{box-shadow:0 0 30px rgba(255,59,92,.4)}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k,d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ toast('Device storage is full or blocked'); return false; } };
const pad = n => String(n).padStart(2,'0');
const tzName = () => { try { return new Intl.DateTimeFormat('en-US',{timeZoneName:'short'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName').value; } catch(e){ return ''; } };
const fmtT = ms => { const d=new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtD = ms => { const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDT = ms => `${fmtD(ms)} ${fmtT(ms)} ${tzName()}`.trim();
const fmtDur = ms => { const m=Math.round(ms/60000); return m<60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`; };

const savePrefs = () => lsSet(LS.prefs, prefs);
const toolLabel = id => (S.tools.find(t=>t.id===id)||{label:id}).label;
const platLabel = id => (S.platforms.find(p=>p.id===id)||{label:id}).label;

/*VALIDATOR-START*/
const ESC = ['ESCALATE_VRE','ESCALATE_TS','ESCALATE_DISPATCH'];
const isEsc = t => ESC.includes(t);
const ESC_LABEL = { ESCALATE_VRE:'Escalate to VRE', ESCALATE_TS:'Open a TS thread', ESCALATE_DISPATCH:'Contact Dispatch' };
const SAFETY_RE = /\b(bypass\w*|override\w*|defeat\w*|jumper\w*|disable\w*\s+(?:the\s+)?(?:interlock|safety|check|alarm|e-?stop)\w*|ignore\w*\s+(?:the\s+|any\s+)?(?:fault|warning|alarm|interlock|check)\w*|skip\w*\s+(?:the\s+)?(?:check|checklist|sop|inspection|pre-?trip)\w*)\b/i;
function nodeTexts(n){
  const out=[n.text,n.help,n.caution,n.handoffNote,n.placeholder,n.done_when,...(n.steps||[]),...(n.options||[]).map(o=>o.label)];
  (n.variants||[]).forEach(v=>out.push(v.text,v.help,v.caution,...(v.steps||[])));
  return out.filter(Boolean);
}
function validateTree(t, knownIds){
  const E=[], W=[]; let placeholders=0, drafts=0;
  if(!t || typeof t!=='object' || Array.isArray(t)) return {errors:['File is not a tree object'],warnings:[],placeholders:0};
  ['id','title','version','start','nodes'].forEach(k=>{ if(t[k]==null) E.push(`Missing "${k}"`); });
  if(t.role && !['category','triage','sequence'].includes(t.role)) E.push('role must be "category", "triage" or "sequence"');
  if(t.status && !['PLACEHOLDER','DRAFT','VERIFIED'].includes(t.status)) E.push('status must be PLACEHOLDER, DRAFT or VERIFIED');
  const N = (t.nodes && typeof t.nodes==='object') ? t.nodes : {};
  const has = id => typeof id==='string' && Object.prototype.hasOwnProperty.call(N,id);
  if(t.start && !has(t.start)) E.push(`start "${t.start}" is not a node`);
  for(const [id,n] of Object.entries(N)){
    const at=`[${id}]`;
    if(!n || !['question','input','action','terminal','route'].includes(n.type)){ E.push(`${at} type must be question, input, action, terminal or route`); continue; }
    if(n.type==='input' && !has(n.next)) E.push(`${at} input next "${n.next}" doesn't exist`);
    if(!n.text) E.push(`${at} missing text`);
    if((n.platforms||n.tools) && !n.skipTo) E.push(`${at} has a tools/platforms filter but no skipTo`);
    if(n.skipTo && !has(n.skipTo)) E.push(`${at} skipTo "${n.skipTo}" doesn't exist`);
    if(n.type==='question'){
      if(!Array.isArray(n.options)||!n.options.length) E.push(`${at} question needs at least one option`);
      else n.options.forEach((o,i)=>{ if(!o.label) E.push(`${at} option ${i+1} has no label`); if(!has(o.next)) E.push(`${at} option ${i+1} next "${o.next}" doesn't exist`);
        if(o.type && !['success','fail','stop'].includes(o.type)) E.push(`${at} option ${i+1} type must be success, fail or stop`);
        if(o.type && String(o.label).trim().split(/\s+/).length>6) W.push(`${at} button "${o.label}" is over 6 words`); });
      if(n.done_when){ const f=(n.options||[]).filter(o=>o.type==='fail' && !/^something else$/i.test(o.label)).length;
        if(f>5) W.push(`${at} has ${f} failure buttons; max is 5 plus Something else`);
        if(!(n.options||[]).some(o=>o.type==='stop')) W.push(`${at} card has no STOP button`); }
    }
    if(n.type==='action'){
      if(n.authorizedRole!=='VO') E.push(`${at} authorizedRole must be "VO". Work a VO isn't authorized to do belongs behind ESCALATE_VRE`);
      if(!Array.isArray(n.steps)||!n.steps.length) E.push(`${at} action needs steps`);
      if(!has(n.next)) E.push(`${at} next (not-resolved path) "${n.next}" doesn't exist`);
      if(n.resolvedNext && !has(n.resolvedNext)) E.push(`${at} resolvedNext "${n.resolvedNext}" doesn't exist`);
    }
    if(n.type==='terminal' && !['RESOLVED',...ESC].includes(n.terminal)) E.push(`${at} terminal must be RESOLVED, ${ESC.join(', ')}`);
    if(n.type==='route' && n.returnTo && !has(n.returnTo)) E.push(`${at} returnTo "${n.returnTo}" doesn't exist`);
    if(n.type==='route'){
      if(!n.tree) E.push(`${at} route needs "tree"`);
      else if(knownIds && !knownIds.includes(n.tree)) W.push(`${at} routes to "${n.tree}", which isn't loaded`);
    }
    if(n.type!=='route' && isPh(n)) placeholders++;
    if(n.type!=='route' && isDraft(n)) drafts++;
    for(const s of nodeTexts(n)){ const m=String(s).match(SAFETY_RE); if(m) E.push(`${at} safety lint: "${m[0]}". No step may bypass a safety check, interlock, or SOP. Reword or remove.`); }
  }
  // reachability, escalation path, cycles
  // fwd=true leaves out the edges that resume a sequence (resolvedNext, returnTo); those loop back on purpose
  const edges = (id,fwd) => { const n=N[id]; if(!n) return []; const e=[];
    if(n.skipTo) e.push(n.skipTo);
    if(n.type==='question') (n.options||[]).forEach(o=>e.push(o.next));
    if(n.type==='action'){ e.push(n.next); if(n.resolvedNext && !fwd) e.push(n.resolvedNext); }
    if(n.type==='input') e.push(n.next);
    if(n.type==='route' && n.returnTo && !fwd) e.push(n.returnTo);
    return e.filter(has); };
  if(has(t.start)){
    const seen=new Set([t.start]), q=[t.start];
    while(q.length){ edges(q.shift()).forEach(x=>{ if(!seen.has(x)){ seen.add(x); q.push(x); } }); }
    Object.keys(N).forEach(id=>{ if(!seen.has(id)) W.push(`[${id}] is unreachable from start`); });
    const canEsc=[...seen].some(id=>N[id].type==='terminal'&&isEsc(N[id].terminal)) || [...seen].some(id=>N[id].type==='route');
    if(!canEsc) E.push('No path reaches an escalation. Every tree must end in a VRE, TS or Dispatch handoff when operator fixes run out.');
    const state={};
    const dfs=id=>{ state[id]=1; for(const x of edges(id,true)){ if(state[x]===1){ W.push(`Loop detected through [${x}]`); return true; } if(!state[x] && dfs(x)) return true; } state[id]=2; return false; };
    dfs(t.start);
  }
  if(placeholders) W.push(`${placeholders} node(s) are PLACEHOLDER (no source doc)`);
  if(drafts) W.push(`${drafts} node(s) are drafted from TS tickets (source starts with TS:), not SOP`);
  if(t.status==='VERIFIED' && (placeholders||drafts)) E.push('status is VERIFIED but some nodes are placeholder or TS-drafted');
  return {errors:E, warnings:W, placeholders, drafts};
}
/*VALIDATOR-END*/

/* ---------- tree loading ---------- */
async function fetchTrees(){
  const r = await fetch('trees/manifest.json', {cache:'no-cache'});
  if(!r.ok) throw new Error('manifest ' + r.status);
  const manifest = await r.json();
  const trees = {}, order = [];
  for(const f of manifest.trees || []){
    try {
      const tr = await fetch('trees/' + f, {cache:'no-cache'});
      if(!tr.ok) throw new Error(tr.status);
      const t = await tr.json();
      if(t && t.id){ trees[t.id]=t; order.push(t.id); }
    } catch(e){ order.push('!'+f); }
  }
  let fleet = null;
  if(manifest.fleet){ try { const fr = await fetch('trees/' + manifest.fleet, {cache:'no-cache'}); if(fr.ok) fleet = await fr.json(); } catch(e){} }
  return { manifest, trees, order, fleet, fetchedAt:Date.now() };
}
async function loadTrees(){
  let data=null;
  if(location.protocol.startsWith('http')){
    try { data = await fetchTrees(); lsSet(LS.cache, data); S.src = navigator.onLine ? 'Loaded from server' : 'Loaded from offline cache'; }
    catch(e){ data = lsGet(LS.cache,null); S.src = data ? 'Offline: using saved copy' : 'No trees: server unreachable'; }
  } else {
    data = lsGet(LS.cache,null); S.src = data ? 'Using saved copy' : 'Opened as a file: import tree files';
  }
  S.fetchedAt = data ? data.fetchedAt : null;
  if(data && data.manifest){ S.tools = data.manifest.tools || DEFAULT_TOOLS; S.platforms = data.manifest.platforms || DEFAULT_PLATFORMS; }
  if(data && data.fleet) S.fleet = data.fleet;
  const imp = lsGet(LS.imported, {trees:{}});
  const all = Object.assign({}, data ? data.trees : {}, imp.trees);
  const order = (data ? data.order.filter(x=>!x.startsWith('!')) : []).slice();
  Object.keys(imp.trees).forEach(id=>{ if(!order.includes(id)) order.push(id); });
  const ids = Object.keys(all);
  S.trees = {}; S.reports = []; S.order = [];
  (data ? data.order.filter(x=>x.startsWith('!')) : []).forEach(x=>S.reports.push({id:x.slice(1),title:x.slice(1),errors:['File missing or not valid JSON'],warnings:[],imported:false}));
  for(const id of order){
    const t = all[id]; const rep = validateTree(t, ids);
    S.reports.push({ id, title:t.title||id, version:t.version, status:t.status||'PLACEHOLDER', role:t.role||'category', imported:!!imp.trees[id], ...rep });
    if(!rep.errors.length){ S.trees[id]=t; S.order.push(id); }
  }
}

/* ---------- session engine ---------- */
const getNode = (treeId,id) => id==='__resolved' ? RESOLVED_BUILTIN : (S.trees[treeId] && S.trees[treeId].nodes[id] ? Object.assign({id}, S.trees[treeId].nodes[id]) : null);
const curNode = () => S.s ? getNode(S.s.cur.tree, S.s.cur.node) : null;
const fits = x => (!x.tools || x.tools.includes(S.s.tool)) && (!x.platforms || x.platforms.includes(S.s.platform));
function view(n){
  const v = Object.assign({}, n);
  (n.variants||[]).forEach(va=>{ const w=va.when||{};
    if((!w.tool||w.tool===S.s.tool) && (!w.platform||w.platform===S.s.platform))
      ['text','help','steps','caution','done_when'].forEach(k=>{ if(va[k]!=null) v[k]=va[k]; }); });
  return v;
}
function settle(){
  for(let guard=0; guard<200; guard++){
    const n = curNode(); if(!n) return;
    if(n.type!=='terminal' && !fits(n)){ S.s.cur.node = n.skipTo; continue; }
    if(n.type==='terminal' && n.terminal==='RESOLVED' && S.s.calls && S.s.calls.length){
      // a fix tree called from a sequence cleared the blocker: go back where it was called from
      const r = S.s.calls.pop(), t = S.trees[r.tree];
      S.s.steps.push({ kind:'route', tree:r.tree, node:r.node, text:`Fixed. Resumed: ${t ? t.title : r.tree}`, short:'↩ Resumed', at:Date.now() });
      S.s.symptom = r.symptom || S.s.symptom;
      S.s.cur = { tree:r.tree, node:r.node, phase:'node' };
      continue;
    }
    if(n.type==='route'){
      const t = S.trees[n.tree]; if(!t) return;
      S.s.steps.push({ kind:'route', tree:S.s.cur.tree, node:n.id, text:`Narrowed to: ${t.title}`, short:'→ '+t.title, at:Date.now() });
      const from = S.trees[S.s.cur.tree];
      if(n.returnTo) (S.s.calls = S.s.calls || []).push({ tree:S.s.cur.tree, node:n.returnTo, symptom:S.s.symptom });
      S.s.symptom = from && from.role==='triage' ? `${t.title} (via "I'm not sure")` : `${t.title} (via ${from ? from.title : 'another tree'})`;
      S.s.versions[t.id] = { v:t.version, status:t.status||'PLACEHOLDER' };
      S.s.cur = { tree:t.id, node:t.start, phase:'node' };
      continue;
    }
    return;
  }
}
function snapshot(){ S.s.stack.push({ cur:Object.assign({},S.s.cur), stepsLen:S.s.steps.length, symptom:S.s.symptom, calls:JSON.parse(JSON.stringify(S.s.calls||[])), at:S.s.at||'', failure:S.s.failure||'', ctx:Object.assign({},S.s.ctx||{}) }); }
function finalizeIfTerminal(){
  const n = curNode();
  if(n && n.type==='terminal' && !S.s.outcome){
    S.s.outcome = n.terminal; S.s.endedAt = Date.now(); S.s.handoffNote = n.handoffNote || '';
    upsertHistory(S.s); wake(false);
  }
}
function commit(){ settle(); finalizeIfTerminal(); saveActive(); render(); }
function goto(node){ S.s.cur = { tree:S.s.cur.tree, node, phase:'node' }; commit(); }

function startRun(treeId){
  const su = S.setup, truck = (su.truck||'').trim(), trailer = (su.trailer||'').trim();
  const miss = [];
  if(!truck) miss.push('truck'); if(!trailer) miss.push('trailer'); if(!su.tool) miss.push('tool'); if(!su.platform) miss.push('platform');
  if(miss.length){ S.flag = true; render(); toast('Add ' + miss.join(', ') + ' first'); return; }
  const t = S.trees[treeId]; if(!t) return;
  const bump = (arr,v) => [v, ...(arr||[]).filter(x=>x!==v)].slice(0,5);
  Object.assign(prefs, { lastTruck:truck, lastTrailer:trailer, lastTool:su.tool, lastPlatform:su.platform, recentTrucks:bump(prefs.recentTrucks,truck), recentTrailers:bump(prefs.recentTrailers,trailer) }); savePrefs();
  S.s = {
    id: 'RP-' + Date.now().toString(36).toUpperCase(),
    truck, trailer, tool:su.tool, platform:su.platform,
    symptom: t.role==='triage' ? "I'm not sure (narrowing)" : t.title,
    startedAt:Date.now(), endedAt:null, outcome:null, note:'',
    steps:[], stack:[], cur:{ tree:t.id, node:t.start, phase:'node' },
    versions:{ [t.id]:{ v:t.version, status:t.status||'PLACEHOLDER' } },
    calls:[], ctx:{}, at:'', failure:''
  };
  S.screen='run'; S.flag=false; S.resume=null; wake(true); commit();
}

function back(){
  const s = S.s; if(!s) return;
  if(!s.stack.length){
    if(!s.steps.length || confirm('Leave this run and go back to setup? It will be saved as abandoned.')){
      if(s.steps.length){ s.outcome='ABANDONED'; s.endedAt=Date.now(); upsertHistory(s); }
      closeRun();
    }
    return;
  }
  if(s.outcome){ removeHistory(s.id); s.outcome=null; s.endedAt=null; s.handoffNote=''; wake(true); }
  const snap = s.stack.pop();
  s.cur = snap.cur; s.steps.length = snap.stepsLen; s.symptom = snap.symptom;
  if(snap.calls) s.calls = snap.calls; if(snap.at!=null) s.at = snap.at; if(snap.failure!=null) s.failure = snap.failure; if(snap.ctx) s.ctx = snap.ctx;
  saveActive(); render();
}
function closeRun(){ S.s=null; S.showLog=false; lsSet(LS.active,null); S.screen='entry'; wake(false); render(); }

/* ---------- persistence ---------- */
function saveActive(){ if(S.s) lsSet(LS.active, S.s); }
const histAll = () => lsGet(LS.history, []);
function upsertHistory(s){
  const h = histAll().filter(x=>x.id!==s.id);
  const copy = JSON.parse(JSON.stringify(s)); delete copy.stack;
  h.unshift(copy); lsSet(LS.history, h.slice(0, HISTORY_CAP));
}
function removeHistory(id){ lsSet(LS.history, histAll().filter(x=>x.id!==id)); }

/* ---------- handoff summary ---------- */
function buildSummary(s){
  const L=[];
  const head = s.outcome==='ESCALATE_VRE' ? (s.at ? 'VRE HANDOFF: LAUNCH BLOCKED' : 'VRE HANDOFF: TRUCK NOT REACHING READY STATE')
             : s.outcome==='ESCALATE_TS' ? 'TS THREAD: LAUNCH BLOCKED'
             : s.outcome==='ESCALATE_DISPATCH' ? 'DISPATCH: TRIP OR ORDER PROBLEM'
             : s.outcome==='RESOLVED' ? 'RESOLVED BY OPERATOR: READY-STATE BLOCKER'
             : s.outcome==='ABANDONED' ? 'ABANDONED RUN' : 'RUN IN PROGRESS';
  L.push(`=== ${head} ===`);
  L.push(`Truck: ${s.truck} | Trailer: ${s.trailer==='BOBTAIL'?'Bobtail (no trailer)':(s.trailer||'not recorded')}`);
  L.push(`Platform: ${platLabel(s.platform)} | Tool: ${toolLabel(s.tool)}`);
  L.push(`Symptom: ${s.symptom}`);
  const cx = s.ctx || {};
  if(cx.buildId!=null || s.at) L.push(`Build ID: ${cx.buildId || 'not recorded'}`);
  if(s.at) L.push(`Phase/step: ${s.at}`);
  if(s.failure) L.push(`Button selected: ${s.failure}`);
  Object.entries(cx).filter(([k])=>k!=='buildId').forEach(([k,v])=>L.push(`${k}: ${v}`));
  L.push(`Started: ${fmtDT(s.startedAt)}`);
  if(s.endedAt) L.push(`${isEsc(s.outcome)?'Escalated':'Ended'}: ${fmtDT(s.endedAt)} (${fmtDur(s.endedAt-s.startedAt)})`);
  L.push(`Trees: ${Object.entries(s.versions).map(([id,x])=>`${id} v${x.v} [${x.status}]`).join(', ')}`);
  const ph = s.steps.filter(x=>x.placeholder).length, dr = s.steps.filter(x=>x.draft).length;
  if(ph) L.push(`NOTE: ${ph} step(s) used PLACEHOLDER content not yet verified against Aurora docs.`);
  if(dr) L.push(`NOTE: ${dr} step(s) were drafted from past TS tickets, not SOP.`);
  L.push('', 'STEP LOG');
  if(!s.steps.length) L.push('(no steps recorded)');
  s.steps.forEach((x,i)=>{
    const t = fmtT(x.at);
    if(x.kind==='question') L.push(`${i+1}. [${t}] Q: ${x.text}`, `   A: ${x.answer}`);
    else if(x.kind==='action') L.push(`${i+1}. [${t}] ACTION: ${x.text}`, `   RESULT: ${x.result}${x.reason?` (${x.reason})`:''}`);
    else L.push(`${i+1}. [${t}] ${x.text}`);
  });
  const acts = s.steps.filter(x=>x.kind==='action');
  L.push('', `ACTIONS ATTEMPTED: ${acts.length}`);
  acts.forEach(a=>L.push(`- ${a.text} -> ${a.result}`));
  if(s.handoffNote) L.push('', `WHAT TO ASK FOR: ${s.handoffNote}`);
  if(s.note && s.note.trim()) L.push('', `OPERATOR NOTE: ${s.note.trim()}`);
  if(isEsc(s.outcome)) L.push('', 'ATTACH BEFORE POSTING: screenshot of the TApp/Scout screen showing the error, and the current log ID.');
  L.push('', `Run ID: ${s.id} (READY STATE or DIE)`);
  return L.join('\n');
}
async function copyText(t){
  try { if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } } catch(e){}
  const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok=false; try { ok=document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}

/* ---------- device helpers ---------- */
let wl=null;
async function wake(on){
  try {
    if(on && 'wakeLock' in navigator && !wl){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{ wl=null; }); }
    else if(!on && wl){ await wl.release(); wl=null; }
  } catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.s && !S.s.outcome && S.screen==='run') wake(true); });
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch(e){} };
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2200); }

/* ---------- rendering ---------- */
function render(){
  document.documentElement.dataset.theme = prefs.theme;
  let h = header();
  if(S.screen==='run' && S.s) h += ctxBar() + crumbs();
  h += `<main id="main">${body()}</main>`;
  if(S.screen==='run' && S.s) h += runBar();
  if(S.showLog && S.s) h += logSheet();
  $('#app').innerHTML = h;
  const c=$('.crumbs'); if(c) c.scrollLeft = c.scrollWidth;
  window.scrollTo(0,0);
}
function header(){
  const inRun = S.screen==='run';
  return `<header class="top">
    <button class="brand" data-act="home" aria-label="READY STATE or DIE home"><img class="mark" src="${LOGO}" alt=""><span class="txt">READY STATE <b>or</b> DIE</span></button>
    ${inRun ? '' : `<button class="hbtn ${S.screen==='history'||S.screen==='detail'?'on':''}" data-act="nav" data-arg="history">History</button>
    <button class="hbtn ${S.screen==='trees'?'on':''}" data-act="nav" data-arg="trees">Trees</button>`}
    <button class="hbtn" data-act="theme" aria-label="Switch theme">${prefs.theme==='sun'?'Night':'Sun'}</button>
  </header>`;
}
function ctxBar(){
  const s=S.s;
  return `<div class="ctx"><span class="pill truck">${esc(s.truck)}</span>${s.trailer?`<span class="pill">${esc(s.trailer==='BOBTAIL'?'Bobtail':s.trailer)}</span>`:''}<span class="pill">${esc(platLabel(s.platform))}</span><span class="pill">${esc(toolLabel(s.tool))}</span><span class="pill">${esc(s.symptom)}</span></div>`;
}
function crumbs(){
  const st = S.s.steps;
  const chips = st.map(x=>{
    const cls = x.kind==='action' ? (x.result==='RESOLVED'?'y':'x') : '';
    const mark = x.kind==='action' ? (x.result==='RESOLVED'?' ✓':x.result==='NOT PERFORMED'?' –':' ✗') : '';
    return `<span class="chip ${cls}">${esc(x.short)}${mark}</span>`;
  }).join('');
  return `<button class="crumbs" data-act="log" aria-label="Show full log of answers">${chips || '<span class="empty">Your answers will show here. Tap to see the full log.</span>'}${st.length?`<span class="chip more">Log (${st.length})</span>`:''}</button>`;
}
function runBar(){
  const done = !!S.s.outcome;
  return `<nav class="bar">
    <button class="btn sm" data-act="back">◀ Back</button>
    ${done ? `<button class="btn sm pri" data-act="newrun">New run</button>` : `<button class="btn sm" data-act="restart">Restart</button><button class="btn sm" data-act="end">End run</button>`}
  </nav>`;
}
function phBanner(n){
  if(n.id==='__resolved') return '';
  if(isPh(n)) return `<div class="ph"><div>Placeholder: not from Aurora docs. Verify against SOP.</div></div>`;
  if(isDraft(n)) return `<div class="draft"><b>From past TS tickets, not SOP.</b><details class="src"><summary>Source</summary><p>${esc(n.source.replace(/^\s*TS:\s*/i,''))}</p></details></div>`;
  return `<details class="src"><summary>Source</summary><p>${esc(n.source)}</p></details>`;
}
function body(){
  if(S.screen==='history') return historyBody();
  if(S.screen==='detail') return detailBody();
  if(S.screen==='trees') return treesBody();
  if(S.screen==='run' && S.s) return runBody();
  return entryBody();
}

function vehField(kind){
  const su=S.setup, f=S.flag, cur=su[kind]||'';
  const list = kind==='truck' ? (S.fleet.trucks||[]) : (S.fleet.trailers||[]);
  const custom = prefs[kind==='truck'?'customTrucks':'customTrailers'] || [];
  const recent = (prefs[kind==='truck'?'recentTrucks':'recentTrailers'] || []).filter(x=>x!=='BOBTAIL');
  let marked=false;
  const opt=(val,label)=>{ const sel=!marked && val===cur; if(sel) marked=true; return `<option value="${esc(val)}"${sel?' selected':''}>${esc(label)}</option>`; };
  let o = `<option value=""${cur?'':' selected'}>${kind==='truck'?'Pick a truck':'Pick a trailer'}</option><option value="__manual">+ Add manually…</option>`;
  if(kind==='trailer') o += opt('BOBTAIL','Bobtail (no trailer)');
  if(recent.length) o += `<optgroup label="Recent">${recent.map(id=>opt(id,id)).join('')}</optgroup>`;
  if(custom.length) o += `<optgroup label="Added on this device">${custom.map(id=>opt(id,id)).join('')}</optgroup>`;
  const groups = {}; list.forEach(v=>{ (groups[v.loc]=groups[v.loc]||[]).push(v); });
  for(const [loc,vs] of Object.entries(groups)) o += `<optgroup label="${esc(loc)}">${vs.map(v=>opt(v.id, v.desc ? `${v.id} · ${v.desc}` : v.id)).join('')}</optgroup>`;
  if(cur && !marked) o += opt(cur,cur);
  const sel = `<select id="sel-${kind}" class="big ${f&&!cur?'miss':''}">${o}</select>`;
  if(!S.manual[kind]) return sel;
  return `${sel}<div class="addrow"><input id="man-${kind}" class="big id" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${kind==='truck'?'e.g. alts4-00029':'e.g. PREM-5180240'}"><button class="btn sm sig" data-act="addVeh" data-arg="${kind}">Add</button></div>
    <button class="btn sm" data-act="cancelVeh" data-arg="${kind}">Cancel</button>`;
}
function entryBody(){
  const su=S.setup, f=S.flag;
  const cats = S.order.map(id=>S.trees[id]).filter(t=>(t.role||'category')==='category'
    && (!su.tool || !t.tools || t.tools.includes(su.tool))
    && (!su.platform || !t.platforms || t.platforms.includes(su.platform)));
  const triage = S.order.map(id=>S.trees[id]).find(t=>t.role==='triage');
  const seqs = S.order.map(id=>S.trees[id]).filter(t=>t.role==='sequence');
  const bad = S.reports.filter(r=>r.errors.length).length;
  const r = S.resume;
  return `
  ${r ? '' : `<img class="hero" src="${LOGO}" alt="READY STATE or DIE">`}
  ${r ? `<div class="banner"><b>Unfinished run on ${esc(r.truck)}</b><span class="help">${esc(r.symptom)}, started ${esc(fmtT(r.startedAt))}, ${r.steps.length} step(s) so far.</span>
    <div class="row2"><button class="btn sm pri" data-act="resume">Resume</button><button class="btn sm" data-act="discard">Discard</button></div></div>` : ''}
  <label class="field-label ${f&&!su.truck?'miss':''}" for="sel-truck">Truck</label>
  ${vehField('truck')}
  <label class="field-label ${f&&!su.trailer?'miss':''}" for="sel-trailer">Trailer</label>
  ${vehField('trailer')}
  <div class="field-label ${f&&!su.tool?'miss':''}">Tool</div>
  <div class="seg">${S.tools.map(t=>`<button class="btn sm ${su.tool===t.id?'sel':''}" data-act="tool" data-arg="${esc(t.id)}" aria-pressed="${su.tool===t.id}">${esc(t.label)}</button>`).join('')}</div>
  <div class="field-label ${f&&!su.platform?'miss':''}">Platform</div>
  <div class="seg">${S.platforms.map(p=>`<button class="btn sm ${su.platform===p.id?'sel':''}" data-act="plat" data-arg="${esc(p.id)}" aria-pressed="${su.platform===p.id}">${esc(p.label)}</button>`).join('')}</div>
  ${seqs.length?`<h2>Launching?</h2><div class="list">${seqs.map(t=>`<button class="btn sig" data-act="start" data-arg="${esc(t.id)}">${esc(t.title)}${t.status!=='VERIFIED'?`<span class="tag">${esc(t.status||'PLACEHOLDER')}</span>`:''}</button>`).join('')}</div>`:''}
  <h2>What's keeping it from ready state?</h2>
  ${cats.length || triage ? '' : `<div class="banner"><b>No fault trees loaded.</b><span class="help">${esc(S.src)}. Import the .json files from the trees folder to use the app offline.</span><button class="btn sm pri" data-act="import">Import tree files</button></div>`}
  <div class="list">
    ${cats.map(t=>`<button class="btn ans" data-act="start" data-arg="${esc(t.id)}">${esc(t.title)}${t.status!=='VERIFIED'?`<span class="tag">${esc(t.status||'PLACEHOLDER')}</span>`:''}</button>`).join('')}
    ${triage ? `<button class="btn ans sig" data-act="start" data-arg="${esc(triage.id)}">I'm not sure. Help me narrow it down</button>` : ''}
  </div>
  <p class="status">${S.order.length} tree(s) ready. ${esc(S.src)}.${bad?` <b class="err">${bad} tree file(s) failed checks. See Trees.</b>`:''}${navigator.onLine?'':' Device is offline.'}</p>`;
}

const resumes = n => !!(n.resolvedNext && (()=>{ const t=getNode(S.s.cur.tree,n.resolvedNext); return t && t.type!=='terminal'; })()) || !!(S.s.calls && S.s.calls.length);
const copyLabel = () => S.s && S.s.outcome==='ESCALATE_DISPATCH' ? 'Copy message for Dispatch' : 'Copy for TS thread';
function runBody(){
  const s=S.s, n=curNode();
  if(!n) return `<div class="banner"><b>This step can't be found.</b><span class="help">The tree may have changed since this run started. Escalate with what's been logged so far.</span>
    <button class="btn bad" data-act="forceEsc">Escalate to VRE now</button></div>`;
  const v = view(n);
  if(n.type==='question'){
    const qn = s.steps.filter(x=>x.kind==='question').length + 1;
    const opts = (n.options||[]).map((o,i)=>Object.assign({_i:i},o)).filter(fits);
    if(v.done_when){
      const cls = o => o.type==='success' ? 'ok' : o.type==='stop' ? 'bad stop' : 'ans';
      return `<p class="step-no">${esc(n.phase||'')}</p>
        ${n.tapp_changed?`<span class="badge">Updated TApp: this screen changed</span>`:''}
        <h1 class="q">${esc(v.text)}</h1>
        ${v.help?`<p class="help">${esc(v.help)}</p>`:''}
        <div class="done"><b>Done when</b>${esc(v.done_when)}</div>
        ${phBanner(n)}
        <div class="answers">${opts.map(o=>`<button class="btn ${cls(o)}" data-act="ans" data-arg="${o._i}">${esc(o.label)}</button>`).join('')}</div>`;
    }
    return `${phBanner(n)}<p class="step-no">Question ${qn}</p><h1 class="q">${esc(v.text)}</h1>
      ${v.help?`<p class="help">${esc(v.help)}</p>`:''}
      <div class="answers">${opts.map(o=>`<button class="btn ans" data-act="ans" data-arg="${o._i}">${esc(o.label)}</button>`).join('')}</div>`;
  }
  if(n.type==='input'){
    const qn = s.steps.filter(x=>x.kind==='question').length + 1;
    return `${phBanner(n)}<p class="step-no">Question ${qn}</p><h1 class="q">${esc(v.text)}</h1>
      ${v.help?`<p class="help">${esc(v.help)}</p>`:''}
      <textarea id="inp" placeholder="${esc(n.placeholder||'')}"></textarea>
      <div class="answers"><button class="btn sig" data-act="inputDone" data-arg="1">Continue</button><button class="btn sm" data-act="inputDone" data-arg="0">Skip</button></div>`;
  }
  if(n.type==='action'){
    if(s.cur.phase==='verify') return `<p class="step-no">You did: ${esc(v.text)}</p><h1 class="q">Did this resolve it?</h1>
      <p class="help">Check the tool. Only say yes if the blocker is actually cleared.</p>
      <div class="answers"><button class="btn ok" data-act="fixed" data-arg="yes">${resumes(n)?'Fixed: resume launch':"Yes, it's resolved"}</button><button class="btn bad" data-act="fixed" data-arg="no">${resumes(n)?'Still failing: next fix':'No, still blocked'}</button></div>`;
    if(s.cur.phase==='cant') return `<p class="step-no">${esc(v.text)}</p><h1 class="q">Why can't you do this step?</h1>
      <p class="help">It's logged for the VRE, then you'll move to the next step.</p>
      <div class="answers">${["Doesn't apply to this truck","Not safe right now","Not authorized or not trained","Tool won't allow it"].map(r=>`<button class="btn ans" data-act="cantwhy" data-arg="${esc(r)}">${esc(r)}</button>`).join('')}</div>`;
    return `${phBanner(n)}<section class="act"><div class="act-head"><span>Do this</span></div><div class="act-body">
      <h1 class="q">${esc(v.text)}</h1>
      ${(v.steps||[]).length?`<ol class="steps">${v.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
      ${v.caution?`<div class="caution">${esc(v.caution)}</div>`:''}</div></section>
      <div class="answers"><button class="btn sig" data-act="done">${esc(v.doneLabel||'Done, I did this')}</button><button class="btn sm" data-act="cant">I can't do this step</button></div>`;
  }
  if(n.type==='terminal' && n.terminal==='RESOLVED'){
    return `<div class="term ok">Resolved<small>${esc(v.text)}</small></div>
      <p class="help">Saved to history on this device.</p>
      <div class="answers"><button class="btn pri" data-act="newrun">Start a new run</button><button class="btn sm" data-act="copy">Copy run summary</button></div>`;
  }
  if(n.type==='terminal'){
    return `<div class="term bad">${n.stop?'STOP. Don\'t touch.':esc(ESC_LABEL[n.terminal]||'Escalate')}<small>${esc(v.text)}</small></div>
      ${n.handoffNote?`<div class="draft"><b>What to ask for:</b> ${esc(n.handoffNote)}</div>`:''}
      <button class="btn sig" data-act="copy" id="copyBtn">${copyLabel()}</button>
      ${navigator.share?`<button class="btn sm" data-act="share">Share to app…</button>`:''}
      <label class="field-label" for="note">Note (optional)</label>
      <textarea id="note" placeholder="What you see on screen, anything unusual…">${esc(s.note)}</textarea>
      <pre class="sum" id="sum">${esc(buildSummary(s))}</pre>`;
  }
  return `<div class="banner"><b>A route points to a tree that isn't loaded.</b><button class="btn bad" data-act="forceEsc">Escalate to VRE now</button></div>`;
}

function logSheet(){
  const s=S.s;
  return `<div class="sheet" role="dialog" aria-label="Run log"><div class="sheet-body">
    <h1 class="q">Run log</h1><p class="help">${esc(s.truck)}, started ${esc(fmtT(s.startedAt))}</p>
    <ol class="log">${s.steps.map(x=>`<li><span class="t">${esc(fmtT(x.at))}</span>${
      x.kind==='question'?`${esc(x.text)}<br><b>${esc(x.answer)}</b>`:
      x.kind==='action'?`${esc(x.text)}<br><b>${esc(x.result)}${x.reason?` (${esc(x.reason)})`:''}</b>`:`<b>${esc(x.text)}</b>`}</li>`).join('') || '<li>No steps yet.</li>'}</ol>
  </div><nav class="bar" style="grid-template-columns:1fr"><button class="btn sm pri" data-act="log">Close log</button></nav></div>`;
}

function historyBody(){
  const h = histAll();
  if(!h.length) return `<h1 class="q">History</h1><p class="help">Finished runs are saved here on this device. Start a run from the home screen.</p>`;
  return `<h1 class="q">History</h1><div class="list">${h.map(x=>`<button class="item" data-act="hist" data-arg="${esc(x.id)}">
    <span class="o ${esc(x.outcome)}">${isEsc(x.outcome)?'Escalated':x.outcome==='RESOLVED'?'Resolved':'Abandoned'}</span>
    <b>${esc(x.truck)}: ${esc(x.symptom)}</b><span>${esc(fmtD(x.startedAt))} ${esc(fmtT(x.startedAt))}${x.trailer?`, ${esc(x.trailer==='BOBTAIL'?'bobtail':x.trailer)}`:''}, ${esc(platLabel(x.platform))}, ${esc(toolLabel(x.tool))}, ${x.steps.length} steps</span></button>`).join('')}</div>
    <div class="row2"><button class="btn sm" data-act="exportHist">Export history</button><button class="btn sm bad" data-act="clearHist">Clear history</button></div>`;
}
function detailBody(){
  const x = histAll().find(r=>r.id===S.histId);
  if(!x) return `<p class="help">That run is no longer in history.</p><button class="btn sm" data-act="nav" data-arg="history">Back to history</button>`;
  return `<button class="btn sm" data-act="nav" data-arg="history">◀ History</button>
    <pre class="sum" style="max-height:none">${esc(buildSummary(x))}</pre>
    <button class="btn sig" data-act="histcopy">Copy summary</button>
    <button class="btn sm bad" data-act="histdel">Delete this run</button>`;
}
function treesBody(){
  const when = S.fetchedAt ? `${fmtD(S.fetchedAt)} ${fmtT(S.fetchedAt)}` : 'never';
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller ? 'Offline mode is on.' : 'Offline mode not active (needs https hosting).';
  return `<h1 class="q">Fault trees</h1>
    <p class="help">${esc(S.src)}. Last fetched ${esc(when)}. ${esc(sw)}</p>
    <p class="help">Fleet list: ${(S.fleet.trucks||[]).length} trucks, ${(S.fleet.trailers||[]).length} trailers${S.fleet.generated?`, built ${esc(S.fleet.generated)} from ${esc(S.fleet.source||'fleet sheet')}`:''}. Added on this device: ${(prefs.customTrucks||[]).length} trucks, ${(prefs.customTrailers||[]).length} trailers.</p>
    <div class="row2"><button class="btn sm pri" data-act="reload">Reload trees</button><button class="btn sm" data-act="import">Import tree files</button></div>
    ${S.reports.some(r=>r.imported)?`<button class="btn sm" data-act="clearImported">Remove imported trees</button>`:''}
    <div class="list">${S.reports.map(r=>`<div class="tree">
      <b>${esc(r.title)} <span class="help">(${esc(r.id)} v${esc(r.version||'?')}, ${esc(r.status||'')}${r.role==='triage'?', triage':''}${r.imported?', imported':''})</span></b>
      ${r.errors.length?`<span class="err">Not loaded. Fix ${r.errors.length} error(s):</span><ul>${r.errors.map(e=>`<li class="err">${esc(e)}</li>`).join('')}</ul>`:'<span>Loaded</span>'}
      ${r.warnings.length?`<ul>${r.warnings.map(w=>`<li class="warn">${esc(w)}</li>`).join('')}</ul>`:''}
    </div>`).join('') || '<p class="help">No trees found.</p>'}</div>`;
}

/* ---------- actions ---------- */
const A = {
  home(){ if(S.screen==='run') return; S.screen='entry'; render(); },
  nav(arg){ if(S.screen==='run') return; S.screen=arg; render(); },
  theme(){ prefs.theme = prefs.theme==='sun'?'night':'sun'; savePrefs(); render(); },
  tool(id){ S.setup.tool=id; render(); },
  addVeh(kind){
    const el=$('#man-'+kind), v=(el&&el.value||'').trim();
    if(!v){ toast('Type the '+kind+' number first'); return; }
    const key = kind==='truck'?'customTrucks':'customTrailers';
    prefs[key] = [v, ...(prefs[key]||[]).filter(x=>x!==v)].slice(0,30); savePrefs();
    S.setup[kind]=v; S.manual[kind]=false; render(); toast('Added '+v);
  },
  cancelVeh(kind){ S.manual[kind]=false; render(); },
  plat(id){ S.setup.platform=id; render(); },
  start(id){ startRun(id); },
  resume(){ S.s=S.resume; S.resume=null; S.screen='run'; if(!S.s.outcome) wake(true); render(); },
  discard(){ const r=S.resume; if(r.steps.length){ r.outcome='ABANDONED'; r.endedAt=Date.now(); upsertHistory(r); } S.resume=null; lsSet(LS.active,null); render(); },
  ans(i){
    const n=curNode(), o=n.options[+i], v=view(n);
    snapshot();
    S.s.steps.push({ kind:'question', tree:S.s.cur.tree, node:n.id, text:v.text, answer:o.label, short:o.short||o.label, at:Date.now(), placeholder:isPh(n), draft:isDraft(n) });
    if(n.phase){ S.s.at = `${n.phase}: ${v.text}`; if(o.type==='fail'||o.type==='stop') S.s.failure = o.label; }
    if(n.capture) (S.s.ctx = S.s.ctx || {})[n.capture] = o.label;
    goto(o.next);
  },
  inputDone(arg){
    const n=curNode(), v=view(n), el=$('#inp'), val=(arg==='1' && el) ? el.value.trim() : '';
    snapshot();
    if(n.capture && val) (S.s.ctx = S.s.ctx || {})[n.capture] = val;
    S.s.steps.push({ kind:'question', tree:S.s.cur.tree, node:n.id, text:v.text, answer: val || '(skipped)', short: val ? (val.length>18 ? val.slice(0,17)+'…' : val) : 'Skipped', at:Date.now(), placeholder:isPh(n), draft:isDraft(n) });
    goto(n.next);
  },
  done(){ snapshot(); S.s.cur.phase='verify'; saveActive(); render(); },
  cant(){ snapshot(); S.s.cur.phase='cant'; saveActive(); render(); },
  cantwhy(reason){ const n=curNode(); logAction(n,'NOT PERFORMED',reason); goto(n.next); },
  fixed(arg){
    const n=curNode();
    if(arg==='yes'){ logAction(n,'RESOLVED'); goto(n.resolvedNext || '__resolved'); }
    else { logAction(n,'NOT RESOLVED'); goto(n.next); }
  },
  back(){ back(); },
  end(){
    if(!confirm('End this run without resolving or escalating? It will be saved as abandoned.')) return;
    S.s.outcome='ABANDONED'; S.s.endedAt=Date.now(); upsertHistory(S.s); closeRun();
  },
  newrun(){ closeRun(); },
  restart(){
    if(!confirm('Start this truck over from the first step? This run is saved as abandoned.')) return;
    const s=S.s, first=Object.keys(s.versions)[0];
    if(s.steps.length){ s.outcome='ABANDONED'; s.endedAt=Date.now(); upsertHistory(s); }
    Object.assign(S.setup, { truck:s.truck, trailer:s.trailer, tool:s.tool, platform:s.platform });
    S.s=null; startRun(first);
  },
  forceEsc(){ snapshot(); S.s.cur = { tree:S.s.cur.tree, node:'__forceEsc', phase:'node' }; S.s.outcome='ESCALATE_VRE'; S.s.endedAt=Date.now(); upsertHistory(S.s); saveActive(); renderForced(); },
  async copy(){
    const ok = await copyText(buildSummary(S.s));
    toast(ok ? 'Copied' : 'Copy blocked. Long-press the text to copy.');
    const b=$('#copyBtn'); if(b && ok){ b.textContent='Copied ✓'; setTimeout(()=>{ const c=$('#copyBtn'); if(c) c.textContent=copyLabel(); }, 2000); }
  },
  async share(){ try { await navigator.share({ title:`VRE handoff ${S.s.truck}`, text:buildSummary(S.s) }); } catch(e){} },
  log(){ S.showLog=!S.showLog; render(); },
  hist(id){ S.histId=id; S.screen='detail'; render(); },
  async histcopy(){ const x=histAll().find(r=>r.id===S.histId); if(x){ const ok=await copyText(buildSummary(x)); toast(ok?'Copied':'Copy blocked. Long-press the text to copy.'); } },
  histdel(){ if(confirm('Delete this run from history?')){ removeHistory(S.histId); S.screen='history'; render(); } },
  exportHist(){
    const blob=new Blob([JSON.stringify(histAll(),null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`readypath-history-${fmtD(Date.now())}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  clearHist(){ if(confirm('Delete all saved runs on this device?')){ lsSet(LS.history,[]); render(); } },
  async reload(){ await loadTrees(); render(); toast('Trees reloaded'); },
  import(){ $('#importFile').click(); },
  async clearImported(){ if(confirm('Remove all imported trees?')){ lsSet(LS.imported,{trees:{}}); await loadTrees(); render(); } }
};
function logAction(n, result, reason){
  const v=view(n);
  S.s.steps.push({ kind:'action', tree:S.s.cur.tree, node:n.id, text:v.text, short:n.short||'Action', result, reason:reason||'', at:Date.now(), placeholder:isPh(n), draft:isDraft(n) });
}
function renderForced(){
  // escalation when the tree is broken mid-run: reuse the terminal screen
  const n = { id:'__forceEsc', type:'terminal', terminal:'ESCALATE_VRE', text:'Escalated early because the fault tree could not continue.', source:'ReadyPath built-in' };
  S.trees.__forced = { id:'__forced', nodes:{ __forceEsc:n } };
  S.s.cur.tree='__forced'; saveActive(); render();
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled || !A[b.dataset.act]) return;
  buzz(); A[b.dataset.act](b.dataset.arg, b);
});
document.addEventListener('input', e=>{
  /* truck/trailer use change events */
  if(e.target.id==='note' && S.s){ S.s.note = e.target.value; saveActive(); if(S.s.outcome) upsertHistory(S.s); const p=$('#sum'); if(p) p.textContent = buildSummary(S.s); }
});
document.addEventListener('change', e=>{
  const m = e.target.id && e.target.id.match(/^sel-(truck|trailer)$/); if(!m) return;
  const kind = m[1], v = e.target.value;
  if(v==='__manual'){ S.manual[kind]=true; render(); const i=$('#man-'+kind); if(i) i.focus(); return; }
  S.setup[kind] = v;
  if(kind==='truck'){ const t=(S.fleet.trucks||[]).find(x=>x.id===v); if(t && t.platform) S.setup.platform = t.platform; }
  render();
});
$('#importFile').addEventListener('change', async e=>{
  const files=[...e.target.files]; e.target.value='';
  const imp=lsGet(LS.imported,{trees:{}}); let n=0; const bad=[];
  for(const f of files){
    try {
      const j=JSON.parse(await f.text());
      if(j && j.trees && !j.nodes){
        if(j.tools || j.platforms){ const c=lsGet(LS.cache,null)||{trees:{},order:[],fetchedAt:Date.now()}; c.manifest=j; lsSet(LS.cache,c); }
        continue;
      }
      if(j && j.nodes && j.id){ imp.trees[j.id]=j; n++; } else bad.push(f.name);
    } catch(err){ bad.push(f.name); }
  }
  lsSet(LS.imported, imp); await loadTrees(); render();
  toast(`Imported ${n} tree(s)` + (bad.length?`. Skipped: ${bad.join(', ')}`:''));
});
window.addEventListener('online', ()=>{ if(S.screen!=='run') A.reload(); });

/* ---------- boot ---------- */
(async function boot(){
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  await loadTrees();
  const act = lsGet(LS.active,null);
  if(act && !act.outcome && act.steps) S.resume = act;
  else if(act) lsSet(LS.active,null);
  render();
})();
})();
</script>
  <script src="recent.js"></script>
  <script src="glean.js"></script>
</body>
</html>
